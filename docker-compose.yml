services:
  postgres:
    image: postgres:16-alpine
    container_name: freedom-cry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: freedomcry
      POSTGRES_PASSWORD: freedomcry_secret
      POSTGRES_DB: freedomcry_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U freedomcry -d freedomcry_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: freedom-cry-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: freedom-cry-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: "8080"
      GIN_MODE: "release"
      DB_HOST: "postgres"
      DB_PORT: "5432"
      DB_USER: "freedomcry"
      DB_PASSWORD: "freedomcry_secret"
      DB_NAME: "freedomcry_db"
      DB_SSLMODE: "disable"
      REDIS_ADDR: "redis:6379"
      BASE_URL: "${BASE_URL:-http://127.0.0.1:8080}"
      NODE_SECRET: "fc-node-secret-token-key-2026"
      JWT_SECRET: "freedom-cry-super-secure-jwt-secret-change-in-prod"
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  redis_data:
